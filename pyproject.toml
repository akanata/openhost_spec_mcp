[project]
name = "health-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing OpenHost health data to AI agents"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.24",
    "hypercorn>=0.18",
    "mcp>=1.28.1",
    "attrs>=24.0",
    "cattrs>=24.0",
    "httpx>=0.27.1",
    "health-data-service @ git+https://github.com/imbue-openhost/health-data-service-spec@main",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Builds the app's Dockerfile, runs it under podman with the mounts/env its
    # openhost.toml declares, and fronts it with the real OpenHost router. Tests
    # hit a real, containerized app. Requires podman on the host.
    "openhost[test-harness] @ git+https://github.com/imbue-openhost/openhost@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"

[tool.ruff]
line-length = 119
exclude = [
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modern Python syntax)
    "I",      # isort
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = [
    "server",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["server"]
strict = true
ignore_missing_imports = true
# health-data-service ships full type annotations but no py.typed marker;
# without this mypy would otherwise treat every import from it as Any.
follow_untyped_imports = true
exclude = []
